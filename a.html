<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Markdown Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Esteban&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --radius: 12px;
      --container-pad: 20px;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #f1f5f9;
      font-family: "Esteban", serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: var(--max-width);
      margin: auto;
      padding: var(--container-pad);
    }

    .doc {
      background: var(--panel);
      padding: 28px;
      border-radius: var(--radius);
      min-height: 60vh;
      overflow: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
    }

    pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }

    code {
      background: #334155;
      padding: 2px 6px;
      border-radius: 6px;
      color: #e2e8f0;
    }

    h1,
    h2,
    h3 {
      color: #f8fafc;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="doc" id="content">
      <article id="article">
        <h2 style="color:var(--muted)">Loading encrypted document…</h2>
      </article>
    </section>
  </main>

  <script>
    const article = document.getElementById('article');
    const encPath = './assets/a.enc';

    function keyParse(k) {
      return Array.from(k).map(ch => Number(ch));
    }

    function encrypt(plain, key) {
      const base64 = btoa(unescape(encodeURIComponent(plain)));
      const keya = keyParse(key);
      let res = "";
      for (let i = 0; i < base64.length; i++) {
        const shift = keya[i % keya.length];
        const code = base64.charCodeAt(i);
        res += String.fromCharCode((code + shift) % 65536);
      }
      return res;
    }

    function decrypt(cipher, key) {
      const keya = keyParse(key);
      let base64 = "";
      for (let i = 0; i < cipher.length; i++) {
        const shift = keya[i % keya.length];
        let code = cipher.charCodeAt(i) - shift;
        if (code < 0) code += 65536;
        base64 += String.fromCharCode(code);
      }
      try {
        return decodeURIComponent(escape(atob(base64)));
      } catch {
        return "�".repeat(100) + "\n\n" + base64;
      }
    }

    async function loadEncrypted(path) {
      const password = prompt("Enter numeric password:");
      if (!password) {
        article.innerHTML = "<pre>Password required.</pre>";
        return;
      }

      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const encText = await res.text();
        const dec = decrypt(encText, password);

        const html = marked.parse(dec, { mangle: false, headerIds: true });
        article.innerHTML = DOMPurify.sanitize(html);
      } catch (err) {
        article.innerHTML = `<pre>Failed to load ${path}\n${err.message}</pre>`;
      }
    }

    loadEncrypted(encPath);
  </script>
</body>

</html>
