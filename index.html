 view.`},{id:24,question:`In the MVC framework, the View component renders the model into what kind of output?`,options:[`A form suitable for user interaction`,`A raw data structure sent back to the controller`,`An event queue processed by the Activity Manager`,`A compiled executable passed to the operating system`],correctAnswer:0,explanation:`The View component renders the model into a form that is suitable for user interaction. It involves all the UI logic in a software application and presents the application's UI as output. Multiple views can exist for a single model but for different purposes.`}]},{sectionId:2,sectionName:`Section 2`,questions:[{id:25,question:`A development team is building a mobile banking application. One developer argues they should use a framework, while another insists a toolkit is sufficient. The lead architect explains that the two are not mutually exclusive — in fact, some toolkits are already bundled within a framework. Based on this distinction: a framework provides a well-defined environment with structure for building and deploying applications, while a toolkit provides a library of precomposed UI objects. Which analogy BEST captures the relationship between a framework and a toolkit?`,options:[`A toolkit is like a city, and a framework is like a single building within it`,`A framework is like a construction site, and a toolkit is like a single hammer`,`A framework is like a fully equipped workshop, and a toolkit is like the specialized tools within it`,`A toolkit is like an entire operating system, and a framework is like a single API call`],correctAnswer:2,explanation:`A framework is the broader, structured environment (the workshop) that provides everything needed to build an application, while a toolkit is the collection of specific, precomposed tools (the specialized tools within it) used during development. This reflects the note that some toolkits are standalone while others are integrated into a framework.`},{id:26,question:`A software engineering student is comparing the Android and iOS event processing systems. She notes that Android places events in a queue and processes them in FIFO order, while iOS sends touch events as UIEvent objects to specific views. She then asks: how does iOS handle sensor data from gyroscopes differently from touch events? Which of the following CORRECTLY explains this difference?`,options:[`iOS uses the UIKit framework for both touch events and gyroscope sensor data, treating them identically`,`iOS uses a separate Core Motion framework for continuous gyroscope and accelerometer data, while UIEvent handles discrete touch events`,`iOS sends gyroscope data through the same UIEvent pipeline but with a different event type flag`,`iOS does not support gyroscope data and relies on Android APIs for sensor integration`],correctAnswer:1,explanation:`For discrete events like touches, iOS generates UIEvent objects handled by the UIKit framework. For continuous streams of sensor data from accelerometers and gyroscopes, a separate Core Motion framework is used. The mechanism is similar in that sensor data is conveyed from iOS to the application to the particular view, but the framework used is distinct.`},{id:27,question:`A web development instructor is teaching students about Java-based Web frameworks. She presents two frameworks: Framework A is supported by Oracle, plays an important role in Java Enterprise Edition, and comes with in-depth and complex documentation. Framework B is open-source, uses the MVC approach, and is designed for fast development but lacks flexibility due to rigid coding rules. Which frameworks are being described, respectively?`,options:[`Wicket and Struts`,`Struts and JavaServer Faces (JSF)`,`JavaServer Faces (JSF) and Struts`,`Wicket and JavaServer Faces (JSF)`],correctAnswer:2,explanation:`Framework A, supported by Oracle and part of Java Enterprise Edition with complex documentation, is JavaServer Faces (JSF). Framework B, which is open-source, MVC-based, designed for fast development but not flexible, is Struts. Wicket is a third framework supported by Apache, not matching either description.`},{id:28,question:`A junior developer is implementing an MVC-based inventory system. He places all database queries and business rule calculations inside a class he labeled 'DisplayPanel.' His senior developer tells him this violates MVC principles. Based on MVC definitions, what is wrong with the junior developer's implementation?`,options:[`The 'DisplayPanel' class should not exist in an MVC system because MVC only allows two components`,`Database queries and business logic belong in the Model component, not in a component responsible for rendering the UI`,`Business logic should be placed in the View component, while the Controller handles data storage`,`The Controller should handle both database queries and UI rendering simultaneously, replacing the need for a Model`],correctAnswer:1,explanation:`In MVC, the Model component is responsible for the logical structure of data and business logic, including processes like database queries and calculations. The View is solely responsible for rendering the UI output. Placing business logic inside a display or view class violates the separation of concerns that MVC enforces.`},{id:29,question:`A product manager is evaluating whether to adopt the MVC framework for a new cross-platform application. She notes two competing concerns: the team wants fast parallel development across front-end and back-end, but some developers are unfamiliar with the business processes tied to each application module. Based on MVC's documented advantages and disadvantages, which statement MOST accurately reflects the trade-off she faces?`,options:[`MVC enables parallel development but requires all developers to understand the business logic for each component, which can be a barrier`,`MVC is designed to eliminate the need for developers to understand business processes by automating logic through the controller`,`MVC parallel development is only available in Android-based frameworks and not applicable to web applications`,`MVC removes all data access inefficiencies, making the trade-off entirely one-sided in favor of adoption`],correctAnswer:0,explanation:`MVC's documented advantage includes faster development through parallel development of all components. However, a documented disadvantage is that programmers must be knowledgeable about the business process linked to each MVC component. This creates a genuine trade-off: speed of parallel development vs. the expertise barrier for developers unfamiliar with business processes.`},{id:30,question:`In an MVC-based banking application following the class diagram described by Kim (2015), a DepositViewController object is responsible for handling a deposit transaction. Which of the following CORRECTLY describes the role of DepositViewController based on the MVC implementation?`,options:[`It holds the customer's balance data and computes interest as the primary model object`,`It is a subclass of AccountViewController that interprets user input and invokes the Account model`,`It is a superclass of AccountViewController and UIObject that manages all view and controller logic`,`It serves only as a view component and does not interact with the model in any way`],correctAnswer:1,explanation:`DepositViewController is a subclass of AccountViewController, which is itself a subclass of UIObject. Both DepositViewController and WithdrawViewController interpret user input (such as converting textual digit input into integers) and invoke the Account model. The Account class — not DepositViewController — holds the customer's name and balance.`},{id:31,question:`A developer argues: 'The View and Controller in MVC are always strictly separate modules.' A senior architect disagrees. Based on documented MVC implementation practice, which response BEST supports the senior architect's position?`,options:[`The View and Controller are always separate; merging them would violate the definition of MVC`,`In many application architectures, the View and Controller are merged into one module or object because of their close connection, as seen with UI button objects`,`The Controller is a subcomponent of the View and is never treated as an independent layer`,`The MVC standard requires a minimum of four separate components: Model, View, Controller, and Toolkit`],correctAnswer:1,explanation:`It is explicitly stated that in many application architectures and frameworks, the View and Controller are already merged into one module or object because of their close connection. A UI button object, for example, is defined by both attribute parameters (size, label, color) and an event handler — blending view and controller responsibilities.`},{id:32,question:`A student compares Android's event model to iOS's event model for a term paper. She correctly notes that both support higher-level gesture recognition like flicks and swipes. Which statement MOST accurately captures how each platform generates these higher-level gestures from raw input?`,options:[`Both Android and iOS generate high-level gestures at the hardware level before reaching the software layer`,`Android generates composite higher-level events internally from raw inputs like touch and button, while iOS combines touch events in the view to represent gestures like flicks and swipes`,`Android relies solely on Java AWT for gesture recognition, while iOS uses Core Motion for all gesture types`,`iOS generates all gestures via the Core Motion framework, while Android uses UIEvent objects for gesture detection`],correctAnswer:1,explanation:`For Android, multiple or composite higher-level events may be internally recognized and generated from raw external actions, such as touch gestures like flick and swipe. For iOS, touch events can be combined at the view level to represent higher-level gestures such as flicks and swipes. Core Motion is for sensor data, not gestures, and Java AWT is a separate Java framework.`},{id:33,question:`An interactive system development team is debating which architectural pattern to adopt. One team member says: 'We should use MVC because the model component does not depend on the views, so modifications to one will not affect the other.' Another member argues this is not entirely true. Based on documented MVC behavior, which clarification is MOST accurate?`,options:[`The Model depends entirely on the View for its state, so changes to the View always break the Model`,`The Model component does not depend on the Views component, which means modifications to the model do not affect the entire framework — but when a model changes state, it notifies associated views to refresh`,`In MVC, the Controller is the only component that can trigger view refreshes; the model has no communication with the view`,`The View component directly modifies the Model in response to user input, which creates tight coupling between them`],correctAnswer:1,explanation:`The model component does not depend on the views component, which is a documented MVC advantage — modifications do not affect the entire framework. However, when a model changes its state, it does notify its associated views to refresh. This is a one-directional dependency: the model notifies the view, but the model itself does not depend on the view.`},{id:34,question:`A UI designer is selecting a mobile toolkit for an iOS application project. She reviews three options: Toolkit A (free, 6 PSD screens by Sergey Melnik), Toolkit B (free, 50 Sketch screens by Ena Bacanovic), and Toolkit C (powered by Envato Elements, 55+ high-quality screens, considered one of the best for iOS). She needs the most comprehensive, high-quality option for an iOS-first project. Which toolkit should she choose, and why?`,options:[`Toolkit A, because PSD format is the industry standard for iOS development`,`Toolkit B, because 50 screens in Sketch format offers more design flexibility than the others`,`Toolkit C, because it is powered by Envato Elements, contains more than 55 high-quality ready-to-use screens, and is described as one of the best toolkits for creating iOS mobile applications`,`Toolkit A, because it was designed specifically by Sergey Melnik for professional iOS projects`],correctAnswer:2,explanation:`Toolkit C corresponds to the Splash UI Kit, which is powered by Envato Elements Pty Ltd., contains more than 55 high-quality, ready-to-use screens, and is explicitly described as one of the best toolkits for creating iOS mobile applications. Toolkit A (Spool UI Kit) has only 6 screens in PSD format, and Toolkit B (Travel UI Kit) has 50 screens in Sketch format — neither is described as the best for iOS specifically.`}]}]},S={examTitle:`Prefinals Exam Reviewer - GB`,examDescription:`Enlightenment and Neoclassical Literature, Romanticism in Literature, Realism and Naturalism`,totalQuestions:35,sections:[{sectionId:1,sectionName:`Section 1`,questions:[{id:0,question:`Which literary period (1660–1800 CE) focused on reason, logic, social critique, and moral order, and revived ancient Greek and Roman literary forms?`,options:[`Romanticism`,`Realism and Naturalism`,`Enlightenment and Neoclassical Literature`,`The Sublime Period`],correctAnswer:2,explanation:`Enlightenment and Neoclassical Literature (1660–1800 CE) is defined by its focus on reason, logic, social critique, and moral order. Neoclassicism specifically revived ancient Greek and Roman literary forms, valuing clarity, order, and balance.`},{id:1,question:`Which literary period (1780–1850 CE) emphasized emotion, nature, imagination, the sublime, and individualism?`,options:[`Enlightenment and Neoclassical Literature`,`Realism and Naturalism`,`Naturalism`,`Romanticism`],correctAnswer:3,explanation:`Romanticism (1780–1850 CE) is defined by its emphasis on emotion, nature, imagination, the sublime, and individualism. Writers celebrated personal feelings, creativity, and unique experiences, often breaking away from strict rules and traditional forms.`},{id:2,question:`Which literary movement is built upon Realism but further emphasized determinism, showing how environment, heredity, and social conditions shape human behavior?`,options:[`Romanticism`,`Neoclassicism`,`Naturalism`,`The Enlightenment`],correctAnswer:2,explanation:`Naturalism was built upon Realism but emphasized determinism, illustrating how environment, heredity, and social conditions shape human behavior. Naturalist works often depict life as harsh and inevitable, showing forces beyond individual control.`},{id:3,question:`Voltaire used his novella Candide to critique which of the following?`,options:[`The power of nature and individual freedom`,`Blind optimism, organized religion, and societal injustices`,`Personal emotions and the awe of the sublime`,`Determinism and hereditary forces on human behavior`],correctAnswer:1,explanation:`Voltaire, a French Enlightenment writer and philosopher, used Candide to critique blind optimism, organized religion, and societal injustices through sharp reasoning and wit. This is an example of Reason as a main form in Enlightenment and Neoclassical literature.`},{id:4,question:`Jonathan Swift's A Modest Proposal ironically suggested which shocking solution to address famine?`,options:[`Taxing the wealthy to fund food for the poor`,`Establishing government-run food distribution centers`,`That the poor sell their children as food`,`That the poor emigrate to colonized lands abroad`],correctAnswer:2,explanation:`In A Modest Proposal, Jonathan Swift ironically suggested that the poor sell their children as food to solve famine. This shocking exaggeration was a satirical device to expose societal neglect and criticize governmental indifference.`},{id:5,question:`William Wordsworth wrote I Wandered Lonely as a Cloud to celebrate which experience?`,options:[`The terror and isolation of a supernatural sea voyage`,`A hero's rejection of societal expectations`,`How a simple scene of daffodils can inspire joy, peace, and reflection`,`The ambition and consequences of challenging natural laws`],correctAnswer:2,explanation:`William Wordsworth wrote I Wandered Lonely as a Cloud to celebrate how a simple scene of daffodils can inspire joy, peace, and reflection. This poem exemplifies Emotion as a main form of Romanticism, emphasizing intense feelings and personal experience.`},{id:6,question:`Percy Bysshe Shelley's Ode to the West Wind personifies the wind as a force of change. This poem is an example of which main form of Romanticism?`,options:[`The Sublime`,`Individualism`,`Imagination`,`Nature`],correctAnswer:3,explanation:`Ode to the West Wind by Percy Bysshe Shelley is given as the example for Nature in Romanticism, which serves as a source of inspiration, beauty, and spiritual insight. Shelley personifies the wind to highlight nature's power and its influence on human thought.`},{id:7,question:`Mary Shelley wrote Frankenstein to explore ambition, ethics, and the consequences of challenging natural laws. This is an example of which main form of Romanticism?`,options:[`Emotion`,`Nature`,`Imagination`,`The Sublime`],correctAnswer:2,explanation:`Frankenstein by Mary Shelley is the example provided for Imagination in Romanticism, which explores creativity, fantasy, and alternative realities beyond traditional rules. Mary Shelley was an English novelist and the wife of Percy Bysshe Shelley.`},{id:8,question:`Samuel Taylor Coleridge's The Rime of the Ancient Mariner evokes fear, guilt, and wonder through the vast sea and supernatural events. This exemplifies which main form of Romanticism?`,options:[`Individualism`,`Nature`,`Emotion`,`The Sublime`],correctAnswer:3,explanation:`The Rime of the Ancient Mariner by Samuel Taylor Coleridge is the example for The Sublime in Romanticism, which conveys overwhelming beauty, awe, or terror — often connected to nature or intense emotion. The mariner's isolation and supernatural events are central to this effect.`},{id:9,question:`Lord Byron's Childe Harold's Pilgrimage features a hero who values personal experiences over societal expectations. This exemplifies which main form of Romanticism?`,options:[`The Sublime`,`Individualism`,`Imagination`,`Emotion`],correctAnswer:1,explanation:`Childe Harold's Pilgrimage by Lord Byron is the example for Individualism in Romanticism, which celebrates personal freedom, self-expression, and moral reflection. The hero prioritizes his own personal experiences over societal expectations.`},{id:10,question:`Émile Zola is described as which of the following?`,options:[`An English poet who exemplified the Sublime in Romanticism`,`An Irish satirist who used irony and exaggeration in Neoclassical literature`,`A French novelist and leader of the Naturalist movement`,`An American novelist who pioneered the Realist tradition`],correctAnswer:2,explanation:`Émile Zola is described as a French novelist and the leader of the Naturalist movement. His novel Germinal portrays the harsh lives of 19th-century coal miners in France, revealing poverty, exploitation, and class struggles as an example of Social Critique in Realism and Naturalism.`},{id:11,question:`Which of the following is NOT listed as a main form of Romanticism?`,options:[`Emotion`,`Satire`,`The Sublime`,`Individualism`],correctAnswer:1,explanation:`The five main forms of Romanticism are Emotion, Nature, Imagination, The Sublime, and Individualism. Satire is NOT a form of Romanticism — it is a main form associated with Enlightenment and Neoclassical literature, used by writers like Jonathan Swift and Voltaire.`},{id:12,question:`Which of the following is NOT listed as an importance of studying Realism and Naturalism?`,options:[`Depict Everyday Life`,`Examine Influences on Behavior`,`Promote Structure and Clarity`,`Explore Social Challenges`],correctAnswer:2,explanation:`Promote Structure and Clarity is listed as an importance of studying Enlightenment and Neoclassical Literature — not Realism and Naturalism. The stated importances of Realism and Naturalism are: Depict Everyday Life, Examine Influences on Behavior, and Explore Social Challenges.`},{id:13,question:`Lemuel Gulliver is described as which of the following in Gulliver's Travels Part I?`,options:[`A court official and treasurer involved in political rivalries`,`A ship's surgeon and protagonist who becomes a giant in Lilliput`,`A general who defeats the Blefuscudians in battle`,`A tiny ruler who tests Gulliver's loyalty and cleverness`],correctAnswer:1,explanation:`Lemuel Gulliver is the ship's surgeon and protagonist of Gulliver's Travels. In Part I, he becomes a giant relative to the Lilliputians, tiny people about six inches tall. The description of 'a ruler who tests Gulliver' refers to the Emperor of Lilliput.`},{id:14,question:`Who is Flimnap in Gulliver's Travels Part I?`,options:[`The ruler of Blefuscu who opposes Gulliver`,`The ship's surgeon who accompanies Gulliver to Lilliput`,`The treasurer and court official involved in political rivalries and plots`,`The leader of the Lilliputian army who captures Gulliver`],correctAnswer:2,explanation:`Flimnap is the Treasurer and a court official in Lilliput, involved in political rivalries and plots. He is distinct from the Emperor of Lilliput, who is the ruler that tests Gulliver's loyalty and cleverness.`},{id:15,question:`In Gulliver's Travels Part I, what is the climax of the story?`,options:[`Gulliver wakes up tied down on the island of Lilliput after being shipwrecked`,`Gulliver meets the Emperor and earns the trust of the Lilliputians`,`Gulliver uses his size and strength to help Lilliput defeat Blefuscu in a naval battle`,`Gulliver leaves Lilliput and reflects on the absurdity of pride and petty quarrels`],correctAnswer:2,explanation:`The climax of Gulliver's Travels Part I occurs when Gulliver uses his size and strength to help Lilliput defeat Blefuscu in a naval battle. Despite his help, Gulliver grows frustrated with the Lilliputians' trivial disputes and narrow-minded politics.`},{id:16,question:`Which theme of Gulliver's Travels Part I is illustrated by the conflicts between Lilliput and Blefuscu, along with court rivalries involving the Emperor and Flimnap?`,options:[`Perspective and Relativity`,`Pride and Vanity`,`Satire and Human Folly`,`Politics and Power`],correctAnswer:3,explanation:`Politics and Power is the theme illustrated by the conflicts between Lilliput and Blefuscu and the court rivalries involving the Emperor and Flimnap, which create unnecessary tension. Pride and Vanity is a separate theme related to the Lilliputians' obsession with appearances and small disputes.`},{id:17,question:`What point of view is used in Gulliver's Travels Part I?`,options:[`Third-person omniscient`,`Second-person`,`First-person, with Gulliver as the narrator`,`Third-person limited, focusing on the Emperor of Lilliput`],correctAnswer:2,explanation:`Gulliver's Travels Part I is told from a first-person perspective. Gulliver, the narrator, recounts his shipwreck, his capture by the Lilliputians, and his experiences in their society, sharing his thoughts, observations, and reactions.`},{id:18,question:`In The Adventures of Huckleberry Finn, who is Jim?`,options:[`Huck's abusive, alcoholic father who sparks Huck's escape`,`A conman who deceives townspeople along the Mississippi River`,`A runaway slave owned by Miss Watson; compassionate, loyal, and values freedom and friendship`,`Huck's imaginative friend who helps plan an elaborate escape scheme`],correctAnswer:2,explanation:`Jim is described as a runaway slave owned by Miss Watson. He is characterized as compassionate, loyal, and someone who values freedom and friendship. Tom Sawyer is Huck's imaginative friend, and Pap Finn is Huck's abusive father.`},{id:19,question:`In The Adventures of Huckleberry Finn, what role do the Duke and the King play?`,options:[`They are court officials who support Huck and Jim's journey to freedom`,`They are conmen who deceive townspeople and create chaos, adding external obstacles`,`They are law enforcement figures who pursue Huck and Jim along the river`,`They are friends of Tom Sawyer who help plan Jim's escape`],correctAnswer:1,explanation:`The Duke and the King are described as conmen who are deceitful, greedy, and chaotic. They deceive townspeople and create chaos along the journey, adding external obstacles that challenge Huck and Jim. They are antagonistic figures, not allies.`}]},{sectionId:2,sectionName:`Section 2`,questions:[{id:20,question:`Enlightenment and Neoclassical literature is to reason and order as Romanticism is to which of the following?`,options:[`Determinism and social critique`,`Emotion and imagination`,`Objectivity and everyday realism`,`Heredity and environment`],correctAnswer:1,explanation:`Enlightenment and Neoclassical literature is defined by reason, logic, and moral order. Romanticism, by contrast, is defined by its emphasis on emotion, nature, imagination, the sublime, and individualism. These two periods represent contrasting literary values.`},{id:21,question:`Voltaire's Candide is to Enlightenment reason and social critique as Jonathan Swift's A Modest Proposal is to which of the following?`,options:[`Romantic individualism and personal freedom`,`Naturalist determinism and social conditions`,`Enlightenment satire and criticism of governmental indifference`,`Realist characterization and moral struggle`],correctAnswer:2,explanation:`Both Candide and A Modest Proposal are Enlightenment-era works that use their respective forms — reason and satire — to critique society. Candide uses reasoning and wit, while A Modest Proposal uses shocking ironic exaggeration to expose societal neglect and government indifference.`},{id:22,question:`Mary Shelley's Frankenstein is to Imagination in Romanticism as Samuel Taylor Coleridge's The Rime of the Ancient Mariner is to which Romantic form?`,options:[`Emotion`,`Individualism`,`Nature`,`The Sublime`],correctAnswer:3,explanation:`Frankenstein exemplifies Imagination in Romanticism, exploring creativity and alternative realities. The Rime of the Ancient Mariner exemplifies The Sublime, conveying overwhelming awe, fear, and guilt through the vast sea, supernatural events, and the mariner's isolation.`},{id:23,question:`Lord Byron's Childe Harold's Pilgrimage is to Individualism in Romanticism as William Wordsworth's I Wandered Lonely as a Cloud is to which Romantic form?`,options:[`The Sublime`,`Imagination`,`Emotion`,`Nature`],correctAnswer:2,explanation:`Childe Harold's Pilgrimage exemplifies Individualism, celebrating personal freedom and self-expression. I Wandered Lonely as a Cloud exemplifies Emotion, celebrating how a simple scene of daffodils inspires joy, peace, and reflection — emphasizing intense personal feeling.`},{id:24,question:`Realism is to depicting ordinary people and everyday moral choices as Naturalism is to which of the following?`,options:[`Celebrating personal freedom and imagination beyond societal rules`,`Reviving ancient Greek and Roman forms for clarity and order`,`Showing how environment, heredity, and social conditions determine human behavior`,`Using wit and irony to critique authority and human folly`],correctAnswer:2,explanation:`Realism portrays ordinary people and everyday life, focusing on moral choices and social interactions. Naturalism, built upon Realism, goes further by emphasizing determinism — showing how environment, heredity, and social conditions shape human behavior, often depicting life as harsh and inevitable.`},{id:25,question:`Émile Zola's Germinal is to Social Critique in Naturalism as Mark Twain's The Adventures of Huckleberry Finn is to which main form of Realism and Naturalism?`,options:[`The Sublime`,`Satire and Wit`,`Detailed Characterization`,`Reason and Logic`],correctAnswer:2,explanation:`Germinal is given as the example for Social Critique in Realism and Naturalism. The Adventures of Huckleberry Finn is given as the example for Detailed Characterization, which presents characters with complex personalities, motivations, and moral struggles shaped by environment, society, and heredity.`},{id:26,question:`Gulliver's internal struggle to adapt to Lilliputian customs while reflecting on human pride is to Character vs. Self as Gulliver's navigation of the Lilliputians' strict rules and court politics is to which conflict type?`,options:[`Character vs. Society`,`Character vs. Nature`,`Character vs. Character`,`Character vs. Fate`],correctAnswer:0,explanation:`Gulliver's internal reflection on human pride is the Character vs. Self conflict. Gulliver's direct navigation of the Lilliputians' strict rules, court politics, and demands is the Character vs. Society conflict.`},{id:27,question:`Huck's internal moral struggle over whether helping Jim is right is to Character vs. Self as Huck's conflict with societal expectations, laws, and racial prejudice is to which conflict type?`,options:[`Character vs. Character`,`Character vs. Nature`,`Character vs. Fate`,`Character vs. Society`],correctAnswer:3,explanation:`Huck's internal dilemma about whether helping Jim is morally right is Character vs. Self. His external conflict with the broader forces of societal expectations, laws, and racial prejudice is Character vs. Society, a separate and distinct conflict type in the novel.`},{id:28,question:`Gulliver's Travels is to satire, irony, and exaggeration as The Adventures of Huckleberry Finn is to which set of literary devices?`,options:[`The Sublime, individualism, and natural imagery`,`Satire, irony, symbolism, and vernacular`,`Reason, logic, and structured moral argument`,`Determinism, heredity, and social conditions`],correctAnswer:1,explanation:`Gulliver's Travels uses exaggeration to highlight human folly, symbolism to represent pride and reason, and irony to expose societal absurdity. The Adventures of Huckleberry Finn is described as using satire, irony, symbolism, and vernacular to give characters authentic voices and capture 19th-century American speech.`},{id:29,question:`The Emperor of Lilliput testing Gulliver's loyalty is to politics and authority in Lilliput as Pap Finn's abuse and control of Huck is to which conflict in The Adventures of Huckleberry Finn?`,options:[`Character vs. Society`,`Character vs. Self`,`Character vs. Character`,`Character vs. Nature`],correctAnswer:2,explanation:`The Emperor of Lilliput is a Character vs. Character conflict involving authority and political power. Similarly, Pap Finn's abuse and control of Huck is explicitly listed as a Character vs. Character conflict — specifically, Huck vs. Pap Finn, as Huck struggles to escape his father's control.`},{id:30,question:`Gulliver's Travels Part I teaches humility and perspective through encounters with Lilliputian folly. This moral lesson compares most directly to which moral of The Adventures of Huckleberry Finn?`,options:[`That environment and heredity determine one's destiny beyond personal control`,`That individual imagination is more powerful than any societal rule or law`,`That freedom, friendship, and doing what is right are more important than blindly following society's rules`,`That structured reason and logic are the highest forms of human expression`],correctAnswer:2,explanation:`Both novels share a moral focus on the limitations of rigid societal rules. Gulliver's Travels teaches perspective, reason, and humility over blind pride. The Adventures of Huckleberry Finn teaches that freedom, friendship, and doing what is right are more important than blindly following society's rules — both reject uncritical conformity.`},{id:31,question:`The Enlightenment's emphasis on questioning authority and encouraging reform through logic compares most directly to which aspect of Realism and Naturalism?`,options:[`The celebration of personal imagination and creative fantasy`,`Social Critique, which exposes inequalities and societal injustices to encourage ethical reflection`,`The revival of ancient Greek and Roman forms for structured moral expression`,`The Sublime, which conveys overwhelming awe and terror connected to nature`],correctAnswer:1,explanation:`Both the Enlightenment and Realism and Naturalism use literature to critique society. The Enlightenment used reason and satire to question authority and encourage reform. Realism and Naturalism's Social Critique form similarly examines society by exposing inequalities, corruption, and injustices to encourage readers to reflect on ethical dilemmas.`},{id:32,question:`The Lilliputians tying Gulliver down upon his arrival is to the rising action of Gulliver's Travels Part I as Huck running away from Pap Finn and meeting Jim on the Mississippi River is to which narrative stage of The Adventures of Huckleberry Finn?`,options:[`The climax`,`The resolution`,`The falling action`,`The exposition and beginning of the journey`],correctAnswer:3,explanation:`The Lilliputians restraining Gulliver is part of the early rising action in Gulliver's Travels. Similarly, Huck running away from Pap Finn and meeting Jim on the Mississippi River is the beginning of the story — the exposition and start of the central journey — which sets the plot in motion.`},{id:33,question:`Gulliver helping Lilliput defeat Blefuscu in a naval battle is to the climax of Gulliver's Travels Part I as Huck and Tom helping Jim escape from captivity is to which narrative stage of The Adventures of Huckleberry Finn?`,options:[`The exposition`,`The rising action`,`The resolution`,`The climax`],correctAnswer:3,explanation:`Both events are the climactic turning points of their respective novels. Gulliver's assistance in the naval battle against Blefuscu is the climax of Gulliver's Travels Part I. Huck and Tom helping Jim escape from captivity, facing danger and uncertainty, is explicitly identified as the climax of The Adventures of Huckleberry Finn.`},{id:34,question:`Neoclassicism is to clarity, order, and balance revived from ancient forms as Romanticism is to which defining set of values?`,options:[`Determinism, objectivity, and the depiction of hereditary forces`,`Reason, moral order, and satirical critique of authority`,`Emotion, imagination, and the celebration of individual freedom and nature`,`Everyday realism, psychological depth, and social inequality`],correctAnswer:2,explanation:`Neoclassicism is defined by clarity, order, and balance — values drawn from ancient Greek and Roman literary traditions. Romanticism stands in contrast, defined by emotion, imagination, the sublime, and the celebration of personal freedom, nature, and individuality. These two movements represent a fundamental shift in literary values.`}]}]},te=o((exports=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}exports.Fragment=n,exports.jsx=r,exports.jsxs=r})),C=c(o(((exports,t)=>{t.exports=te()}))()),ne={selecta:v,prf_ethics:y,prf_im:b,prf_tem:ee,prf_hci:x,prf_gb:S},re=function(e){let t=[...e];for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t};function ie({examData:e,questions:t,answers:n,setAnswers:r,onSubmit:i,page:a,setPage:o}){(0,_.useEffect)(function(){let e=function(e){if(e.key===`Enter`){let n=document.activeElement;n&&n.type===`radio`&&(e.preventDefault(),a===t.length-1?i():o(e=>Math.min(t.length-1,e+1)))}};return window.addEventListener(`keydown`,e),()=>window.removeEventListener(`keydown`,e)},[a,t.length,i,o]);let s=t[a],c=(e,t)=>{r(n=>({...n,[e]:t}))},l=()=>o(e=>Math.max(0,e-1)),u=()=>o(e=>Math.min(t.length-1,e+1));return(0,C.jsxs)(`div`,{className:`container`,children:[(0,C.jsxs)(`header`,{className:`header`,children:[(0,C.jsx)(`h1`,{children:e.examTitle}),(0,C.jsx)(`p`
