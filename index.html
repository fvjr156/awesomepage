dolor sit amet`,options:[`Choice A`],correctAnswer:0,explanation:`'Retake Quiz' to restart, or pick your reviewer then click 'Load Quiz'.`}]}]},y={examTitle:`Prefinals Exam Reviewer - Ethics`,examDescription:`Covers 05 - Bioethics, 06 - AI Ethics and Media Ethics`,totalQuestions:35,sections:[{sectionId:1,sectionName:`Section 1`,questions:[{id:1,question:`Which term refers to the broader field that encompasses ethical concerns in biology, medicine, technology, and global health?`,options:[`Medical Ethics`,`Bioethics`,`Clinical Ethics`,`Environmental Ethics`],correctAnswer:1,explanation:`Bioethics is the broader field covering biology, medicine, technology, and global health — including genetic engineering, AI, and environmental ethics. Medical ethics is narrower, focusing on patient care and clinical decisions.`},{id:2,question:`What is the primary focus of medical ethics?`,options:[`Genetic engineering and cloning`,`AI in biological research`,`Patient care, doctor-patient relationships, and clinical decisions`,`Biodiversity conservation and sustainability`],correctAnswer:2,explanation:`Medical ethics is primarily concerned with patient care, doctor-patient relationships, and clinical decisions such as informed consent, confidentiality, and end-of-life care. The other options fall under the broader scope of bioethics.`},{id:3,question:`Which of the following is NOT one of the Four Pillars of Medical Ethics?`,options:[`Autonomy`,`Beneficence`,`Transparency`,`Non-maleficence`],correctAnswer:2,explanation:`The Four Pillars of Medical Ethics are Autonomy, Beneficence, Non-maleficence, and Justice. Transparency is a core principle of ethical communication and AI ethics, not one of the four medical ethics pillars.`},{id:4,question:`The principle of 'do no harm' in medical ethics is known as:`,options:[`Autonomy`,`Justice`,`Beneficence`,`Non-maleficence`],correctAnswer:3,explanation:`Non-maleficence is defined as the principle of 'do no harm,' requiring healthcare professionals to avoid causing unnecessary harm or suffering. Beneficence means acting in the patient's best interest, which is a related but distinct concept.`},{id:5,question:`Which pillar of medical ethics ensures that all patients receive equal treatment regardless of their background or financial status?`,options:[`Autonomy`,`Justice`,`Beneficence`,`Non-maleficence`],correctAnswer:1,explanation:`Justice in medical ethics means fairness in healthcare, ensuring equal treatment for all patients regardless of background, financial status, or other factors. The other pillars address patient decision-making, acting in the patient's best interest, and avoiding harm.`},{id:6,question:`Which bioethical issue deals with the moral concerns surrounding the use of technology to boost physical and cognitive abilities?`,options:[`Environmental Bioethics`,`Animal Experimentation`,`Biotechnology and Human Enhancement`,`Genetic Engineering and Cloning`],correctAnswer:2,explanation:`Biotechnology and Human Enhancement refers specifically to ethical dilemmas in using technology to enhance physical and cognitive abilities. Genetic Engineering and Cloning focuses on gene modification and designer babies, which is a distinct concern.`},{id:7,question:`Informed consent is a key aspect of which pillar of medical ethics?`,options:[`Justice`,`Non-maleficence`,`Beneficence`,`Autonomy`],correctAnswer:3,explanation:`Securing informed consent before any procedure is listed as a key aspect of Autonomy, which upholds a patient's right to make informed decisions about their own healthcare. The other pillars do not directly address consent.`},{id:8,question:`Which of the following best defines AI ethics?`,options:[`A set of laws that regulate AI companies`,`The development and use of AI in ways that complement human values and social responsibility`,`A framework for replacing human workers with AI systems`,`Guidelines that restrict AI from being used in healthcare`],correctAnswer:1,explanation:`AI ethics focuses on developing and using AI in ways that complement human values and social responsibility, ensuring systems operate properly, respect privacy, and promote accountability. It is not a restrictive legal code or anti-human framework.`},{id:9,question:`Which ethical concern in AI refers to systems making decisions without clear explanations?`,options:[`Bias and Discrimination`,`Job Displacement`,`Lack of Transparency`,`Privacy Violations`],correctAnswer:2,explanation:`Lack of Transparency refers to AI systems making decisions without clear explanations, making it difficult for individuals to understand outcomes such as approvals, rejections, or targeting. The other options describe different but related AI concerns.`},{id:10,question:`Which of the following is NOT identified as an ethical concern in AI and technology?`,options:[`Bias and Discrimination`,`Job Displacement`,`Beneficence`,`Privacy Violations`],correctAnswer:2,explanation:`Beneficence is a pillar of medical ethics, not a listed ethical concern in AI and technology. The ethical concerns in AI include Bias and Discrimination, Privacy Violations, Misinformation, Job Displacement, and Lack of Transparency.`},{id:11,question:`Which core principle of ethical communication requires content to present multiple perspectives and avoid bias?`,options:[`Truth and Accuracy`,`Transparency and Honesty`,`Fairness and Impartiality`,`Privacy and Respect`],correctAnswer:2,explanation:`Fairness and Impartiality requires content to present multiple perspectives and avoid bias to ensure balanced, objective information. Truth and Accuracy pertains to well-researched, factual content, while Transparency relates to disclosing sources and affiliations.`},{id:12,question:`The Hippocratic Oath is most closely associated with which field?`,options:[`Bioethics`,`AI Ethics`,`Media Ethics`,`Medical Ethics`],correctAnswer:3,explanation:`Medical ethics comes from the Hippocratic Oath, an ethical pledge that physicians make. It is specifically a medical tradition and is not the origin of bioethics, AI ethics, or media ethics.`},{id:13,question:`Which of the following is a key aspect of the principle of Beneficence?`,options:[`Ensuring fair distribution of healthcare resources`,`Avoiding unnecessary or excessive treatments`,`Offering treatments that enhance patient health`,`Securing informed consent before any procedure`],correctAnswer:2,explanation:`Offering treatments that enhance patient health is a key aspect of Beneficence, which means acting in the patient's best interest. Fair resource distribution is Justice; avoiding unnecessary treatments is Non-maleficence; informed consent is Autonomy.`},{id:14,question:`Which media ethics issue involves using exaggerated or misleading headlines to attract engagement?`,options:[`Cyberbullying and Harassment`,`Sensationalism and Clickbait`,`Manipulation and Misrepresentation`,`Bias and Lack of Objectivity`],correctAnswer:1,explanation:`Sensationalism and Clickbait describes the use of exaggerated or misleading headlines that sacrifice credibility for engagement. Manipulation involves altering content to fit an agenda, which is a related but distinct issue.`},{id:15,question:`Which of the following is NOT a core principle of ethical communication in media?`,options:[`Truth and Accuracy`,`Privacy and Respect`,`Job Displacement`,`Transparency and Honesty`],correctAnswer:2,explanation:`Job Displacement is an ethical concern associated with AI and automation, not a core principle of ethical communication. The four core principles of ethical communication are Truth and Accuracy, Fairness and Impartiality, Privacy and Respect, and Transparency and Honesty.`},{id:16,question:`Which bioethical issue involves ethical responsibilities related to genetic modification and biodiversity conservation?`,options:[`Biotechnology and Human Enhancement`,`Animal Experimentation`,`Environmental Bioethics`,`Artificial Intelligence in Biological Research`],correctAnswer:2,explanation:`Environmental Bioethics refers to ethical responsibilities in genetic modification, biodiversity conservation, and sustainability. The other options address different bioethical concerns such as human enhancement, animal welfare, and AI's role in research.`},{id:17,question:`Which stakeholders are primarily responsible for establishing ethical AI guidelines according to the module?`,options:[`Students, teachers, and parents`,`Developers, businesses, and policymakers`,`Journalists, editors, and broadcasters`,`Doctors, nurses, and hospital administrators`],correctAnswer:1,explanation:`The module states that developers, businesses, and policymakers must establish guidelines that prioritize transparency, prevent misuse, and balance innovation with society's wellbeing. The other groups are stakeholders in different fields.`},{id:18,question:`Which of the following is NOT listed as a student role in advocating for ethical AI?`,options:[`Educating oneself on AI ethics`,`Developing AI systems independently`,`Critically evaluating AI-generated content`,`Promoting fairness and inclusivity in AI discussions`],correctAnswer:1,explanation:`Developing AI systems independently is not listed as a student advocacy role. The module identifies educating oneself, advocating for transparency, critically evaluating AI content, promoting fairness, and engaging in ethics discussions as student roles.`}]},{sectionId:2,sectionName:`Section 2`,questions:[{id:19,question:`A 65-year-old patient with full mental capacity refuses cancer surgery after being informed of all risks and benefits. The doctor personally disagrees but complies with the patient's decision. Which pillar of medical ethics is being upheld?`,options:[`Justice`,`Non-maleficence`,`Autonomy`,`Beneficence`],correctAnswer:2,explanation:`This scenario directly mirrors the autonomy example from the module. Autonomy means respecting a mentally competent and well-informed patient's decisions, even if the healthcare provider personally disagrees. The doctor is not acting out of fairness (Justice) or harm prevention (Non-maleficence) in this instance.`},{id:20,question:`A hospital provides the same quality of care to both a wealthy executive and an indigent patient without differentiation. This practice best exemplifies which pillar of medical ethics?`,options:[`Autonomy`,`Beneficence`,`Non-maleficence`,`Justice`],correctAnswer:3,explanation:`Justice ensures all patients receive equal treatment regardless of financial status or social standing. Beneficence focuses on promoting patient health, while Autonomy concerns individual decision-making rights — neither is the primary principle illustrated here.`},{id:21,question:`Scientists develop drought-resistant crops to help address global food shortages, while carefully studying the crops' potential impact on local ecosystems. This scenario best represents which bioethical issue?`,options:[`Animal Experimentation`,`Genetic Engineering and Cloning`,`Environmental Bioethics`,`Biotechnology and Human Enhancement`],correctAnswer:2,explanation:`Environmental Bioethics involves ethical responsibilities in genetic modification and sustainability, including considering environmental impacts — exactly what the scientists are doing. Genetic Engineering focuses on human-targeted modifications, not agricultural sustainability.`},{id:22,question:`A doctor avoids prescribing a powerful opioid for a patient experiencing mild headaches and instead recommends a safer over-the-counter painkiller. Which pillar of medical ethics does this best illustrate?`,options:[`Justice`,`Autonomy`,`Non-maleficence`,`Beneficence`],correctAnswer:2,explanation:`Non-maleficence is the principle of 'do no harm,' which includes avoiding unnecessary treatments and reducing risks and potential side effects. This scenario directly parallels the module's example of opting for a safer alternative to avoid unnecessary harm.`},{id:23,question:`An AI-powered hiring tool consistently ranks applicants from elite universities higher than equally qualified candidates from public universities due to patterns in its training data. Which AI ethical concern does this illustrate?`,options:[`Lack of Transparency`,`Privacy Violations`,`Job Displacement`,`Bias and Discrimination`],correctAnswer:3,explanation:`Bias and Discrimination occurs when AI systems reinforce inequalities based on socioeconomic status, ethnicity, or other factors — as shown in the module's Philippine hiring tool example. Lack of Transparency would apply if the system failed to explain its decisions, which is a secondary but separate concern here.`},{id:24,question:`A city installs thousands of CCTV cameras with facial recognition technology to reduce crime. Critics argue the system enables mass monitoring of innocent civilians without their consent. Which AI ethical concern does this raise?`,options:[`Misinformation and Fake News`,`Job Displacement`,`Privacy Violations`,`Bias and Discrimination`],correctAnswer:2,explanation:`Privacy Violations arise when AI collects and analyzes personal data in ways that raise concerns about surveillance and misuse. This mirrors the module's Pasig City Safe City Project example. Bias and Discrimination would require evidence the system targets specific demographic groups unfairly.`},{id:25,question:`A social media influencer promotes a skincare product in a video without disclosing that the brand paid for the review. Which core principle of ethical communication is being violated?`,options:[`Truth and Accuracy`,`Privacy and Respect`,`Fairness and Impartiality`,`Transparency and Honesty`],correctAnswer:3,explanation:`Transparency and Honesty requires disclosing affiliations and conflicts of interest. The module's example explicitly states that influencers must declare paid sponsorships to ensure transparency. Truth and Accuracy pertains to factual correctness, which is a separate concern.`},{id:26,question:`A deepfake video is released showing a politician making inflammatory statements they never actually said, influencing public opinion during an election. Which media ethics issue does this best represent?`,options:[`Cyberbullying and Harassment`,`Sensationalism and Clickbait`,`Manipulation and Misrepresentation`,`Bias and Lack of Objectivity`],correctAnswer:2,explanation:`Manipulation and Misrepresentation involves altering or framing content to fit an agenda and distort the truth. Deepfake videos are explicitly cited in the module as an example of this issue. Bias refers to favoritism in reporting, while Sensationalism refers to misleading headlines.`},{id:27,question:`Bioethics is to medicine as __________ is to journalism. Which concept best completes this analogy?`,options:[`Medical Ethics`,`AI Ethics`,`Media Ethics`,`Environmental Ethics`],correctAnswer:2,explanation:`Just as Bioethics provides a broad ethical framework for medicine and science, Media Ethics provides the ethical framework for journalism and communication. The analogy draws a parallel between the two fields' governing ethical systems.`},{id:28,question:`Autonomy is to patient decision-making as Justice is to __________.`,options:[`Avoiding harm`,`Equal treatment in healthcare`,`Acting in the patient's best interest`,`Obtaining informed consent`],correctAnswer:1,explanation:`Autonomy governs a patient's right to make their own decisions; Justice governs fair and equal treatment in healthcare. Avoiding harm corresponds to Non-maleficence, and acting in the patient's best interest corresponds to Beneficence.`},{id:29,question:`A news outlet consistently frames stories to favor one political candidate while dismissing the opposing candidate's achievements. Which media ethics issue does this illustrate?`,options:[`Sensationalism and Clickbait`,`Misinformation and Disinformation`,`Bias and Lack of Objectivity`,`Exploiting Human Suffering`],correctAnswer:2,explanation:`Bias and Lack of Objectivity refers to favoritism in reporting that misleads audiences and reinforces division. Misinformation involves factually false content, while Sensationalism involves exaggerated headlines — both are distinct from systematic editorial bias.`},{id:30,question:`A researcher uses AI to analyze patient genetic data to predict disease risks. Patients were not informed their data would be used this way. Which two ethical concerns are MOST directly raised?`,options:[`Bias and Discrimination; Job Displacement`,`Privacy Violations; Lack of Transparency`,`Misinformation; Sensationalism`,`Environmental Bioethics; Animal Experimentation`],correctAnswer:1,explanation:`Using patient genetic data without informed consent raises Privacy Violations (unauthorized data use) and Lack of Transparency (patients not knowing how the AI uses their data). This parallels the module's AI in biological research example, which specifically mentions data privacy and consent.`},{id:31,question:`A journalist covering a tragic accident publishes the personal contact details and photographs of grieving family members without permission to increase readership. Which media ethics issue does this violate MOST directly?`,options:[`Sensationalism and Clickbait`,`Bias and Lack of Objectivity`,`Misinformation and Disinformation`,`Exploiting Human Suffering`],correctAnswer:3,explanation:`Exploiting Human Suffering involves using tragedies or sensitive content for views, which is unethical. Publishing private details of grieving families for readership gain directly parallels the module's example of invading a grieving family's privacy for an exclusive. Privacy Violations is related but Exploiting Human Suffering is the more specific and primary concern here.`},{id:32,question:`How does bioethics differ from medical ethics in terms of scope?`,options:[`Bioethics is narrower, focusing only on clinical decisions`,`Medical ethics is broader, covering technology and global health`,`Bioethics is broader, while medical ethics focuses on clinical patient care`,`They are identical in scope and application`],correctAnswer:2,explanation:`Bioethics is broader, encompassing biology, medicine, technology, and global health, while medical ethics is narrower and primarily focused on patient care and clinical decisions. The two are related but differ significantly in scope.`},{id:33,question:`Which comparison between AI ethics and media ethics is MOST accurate based on the module?`,options:[`Both fields are concerned exclusively with legal compliance`,`AI ethics focuses on technological systems, while media ethics focuses on communication and journalism`,`Media ethics encompasses AI ethics as a subcategory`,`AI ethics and media ethics address identical concerns with different terminologies`],correctAnswer:1,explanation:`AI ethics focuses on the responsible development and use of AI systems (bias, transparency, privacy in technology), while media ethics governs responsible communication and journalism (accuracy, fairness, privacy in reporting). They share common concerns like privacy and misinformation but operate in distinct domains.`},{id:34,question:`An athlete undergoes gene therapy to dramatically improve muscle endurance before a major competition. Which bioethical issue does this raise, and what is the primary concern?`,options:[`Environmental Bioethics; sustainability of genetic changes`,`Animal Experimentation; the athlete was used as a test subject`,`Biotechnology and Human Enhancement; fairness in sports`,`Genetic Engineering and Cloning; the athlete may be cloned`],correctAnswer:2,explanation:`The module explicitly cites athletes using gene therapy to enhance muscle growth as an example of Biotechnology and Human Enhancement, with the primary concern being fairness in sports. Environmental Bioethics and Cloning are unrelated to this scenario.`},{id:35,question:`A scholarship application system rejects a student without providing any reason — the student cannot determine if the rejection was due to missing documents, a system error, or algorithmic bias. Which AI ethical concern does this scenario BEST illustrate, and how does it compare to Bias and Discrimination?`,options:[`Bias and Discrimination; the system clearly targeted the student based on ethnicity`,`Lack of Transparency; unlike Bias which targets groups, Lack of Transparency prevents individuals from understanding AI decisions regardless of the cause`,`Privacy Violations; the system collected the student's data without consent`,`Job Displacement; the AI replaced a human scholarship officer who would have explained the decision`],correctAnswer:1,explanation:`This scenario directly mirrors the module's scholarship example under Lack of Transparency — the student cannot understand why the AI rejected them. While Bias and Discrimination involves AI disadvantaging specific groups based on characteristics like ethnicity or socioeconomic status, Lack of Transparency is about the absence of explainability in AI decisions regardless of the underlying cause.`}]}]},b={examTitle:`Prefinals Exam Reviewer - Info Management`,examDescription:`Modules 6-7: Introduction to SQL I & II (DML, DDL, and Query Fundamentals)`,totalQuestions:35,sections:[{sectionId:1,sectionName:`Section 1: SQL Foundations & Terminology`,questions:[{id:0,question:`What does the acronym SQL stand for?`,options:[`Sequential Query Language`,`Structured Query Language`,`Standard Question Logic`,`Systematic Query Listings`],correctAnswer:1,explanation:`SQL stands for Structured Query Language. It is sometimes pronounced as individual letters (S-Q-L) or as 'sequel,' and it is used to create database and table structures, perform data manipulation, and query databases for useful information.`},{id:1,question:`Which of the following is NOT classified as a popular Database Management Tool associated with SQL?`,options:[`MySQL`,`Oracle RDBMS`,`Microsoft SQL Server`,`Adobe Illustrator`],correctAnswer:3,explanation:`Adobe Illustrator is a vector graphics editor, not a database management tool. Popular SQL-based database management tools include MySQL, Oracle RDBMS, Microsoft SQL Server, and Microsoft Access.`},{id:2,question:`Under which SQL data type category do the types 'char', 'text', and 'varchar' belong?`,options:[`Unicode character strings`,`Binary strings`,`Character strings`,`Exact numeric`],correctAnswer:2,explanation:`'char', 'text', and 'varchar' all belong to the Character strings data type category. Unicode character strings include 'nchar', 'ntext', and 'nvarchar', which are distinct from standard character string types.`},{id:3,question:`Which of the following data types belongs to the 'Approximate numeric' category?`,options:[`decimal`,`numeric`,`float`,`money`],correctAnswer:2,explanation:`'float' and 'real' are classified under Approximate numeric data types. 'decimal', 'numeric', and 'money' are all under Exact numeric, which store precise values without approximation.`},{id:4,question:`Which SQL operator category includes the operators AND, OR, NOT, LIKE, IN, BETWEEN, EXISTS, ANY, and ALL?`,options:[`Arithmetic`,`Comparison`,`Compound`,`Logical`],correctAnswer:3,explanation:`AND, OR, NOT, LIKE, IN, BETWEEN, EXISTS, ANY, and ALL are all Logical operators in SQL. Arithmetic operators include +, -, *, /, %; Comparison operators include =, >, <, >=, <=, <>; and Compound operators include +=, -=, *=, /=, %=.`},{id:5,question:`Which SQL comparison operator is used to represent 'not equal to'?`,options:[`!=`,`<>`,`>=`,`=!`],correctAnswer:1,explanation:`In SQL, '<>' is the standard comparison operator used to represent 'not equal to.' It belongs to the Comparison operator category alongside =, >, <, >=, and <=.`},{id:6,question:`What is the purpose of the TRUNCATE TABLE command?`,options:[`It deletes the table and its structure from the database.`,`It removes only the data within a table, keeping the table structure intact.`,`It renames a table within the database.`,`It removes a single column from an existing table.`],correctAnswer:1,explanation:`TRUNCATE TABLE removes only the data (all rows) from a table while preserving the table's structure, column definitions, and constraints. This is different from DROP TABLE, which deletes both the data and the table structure entirely.`},{id:7,question:`Which DDL command is used to add, delete, or modify columns in an existing table?`,options:[`CREATE TABLE`,`DROP TABLE`,`ALTER TABLE`,`TRUNCATE TABLE`],correctAnswer:2,explanation:`ALTER TABLE is the DDL command used to modify the structure of an existing table. It can add new columns, delete existing columns, or modify a column's data type — all without dropping and recreating the table.`},{id:8,question:`What is the correct syntax to add a new column named 'Email' with data type varchar(150) to an existing table named 'Students'?`,options:[`ALTER TABLE Students MODIFY Email varchar(150);`,`ALTER TABLE Students ADD Email varchar(150);`,`CREATE TABLE Students ADD Email varchar(150);`,`UPDATE TABLE Students ADD COLUMN Email varchar(150);`],correctAnswer:1,explanation:`The correct syntax to add a column to an existing table is: ALTER TABLE table_name ADD column datatype. Therefore, 'ALTER TABLE Students ADD Email varchar(150);' is correct. MODIFY and UPDATE TABLE are not valid SQL DDL constructs in this context.`},{id:9,question:`Which constraint ensures that every value stored in a column across all rows is different from one another?`,options:[`NOT NULL`,`PRIMARY KEY`,`UNIQUE`,`CHECK`],correctAnswer:2,explanation:`The UNIQUE constraint ensures that all values in a column are different from each other — no two rows can have the same value in that column. While a PRIMARY KEY also enforces uniqueness, UNIQUE is specifically designed to enforce distinctness on non-primary-key columns.`},{id:10,question:`Which of the following SQL constraints is NOT used to restrict or validate the data values that can be stored in a column?`,options:[`CHECK`,`NOT NULL`,`DEFAULT`,`TRUNCATE`],correctAnswer:3,explanation:`TRUNCATE is a DDL command that removes all records from a table — it is NOT a constraint. CHECK, NOT NULL, and DEFAULT are all SQL constraints: CHECK validates values against a condition, NOT NULL prevents empty values, and DEFAULT provides a fallback value when none is supplied.`},{id:11,question:`A developer writes: ALTER TABLE Students ADD CONSTRAINT df_section DEFAULT 'Not yet enrolled' FOR Section; What does this statement accomplish?`,options:[`It validates that the Section column only accepts the value 'Not yet enrolled'.`,`It renames the Section column to 'Not yet enrolled'.`,`It sets 'Not yet enrolled' as the value automatically inserted into Section when no value is provided.`,`It adds a new column called 'Not yet enrolled' to the Students table.`],correctAnswer:2,explanation:`This statement uses the DEFAULT constraint on an existing table via ALTER TABLE. It assigns 'Not yet enrolled' as the default value for the Section column, meaning that if no section value is explicitly provided during an INSERT, the DBMS will automatically use 'Not yet enrolled'.`},{id:12,question:`Which constraint is used to uniquely identify each row in a table?`,options:[`UNIQUE`,`FOREIGN KEY`,`CHECK`,`PRIMARY KEY`],correctAnswer:3,explanation:`The PRIMARY KEY constraint uniquely identifies each row in a table. A primary key column cannot contain NULL values and must hold unique values across all rows. UNIQUE also enforces uniqueness but can allow NULLs and is not used as the main row identifier.`},{id:13,question:`What is the role of a FOREIGN KEY constraint in a relational database?`,options:[`It prevents duplicate values within the column it is applied to.`,`It uniquely identifies a row within the same table it is defined in.`,`It uniquely identifies a row in another table, establishing a relationship between two tables.`,`It ensures a column cannot be left empty during data insertion.`],correctAnswer:2,explanation:`A FOREIGN KEY constraint establishes a referential link between two tables. It references the PRIMARY KEY of another table, ensuring that the value in the foreign key column corresponds to an existing record in the referenced table.`},{id:14,question:`Consider the following: CREATE TABLE Students (StudentID varchar(11) NOT NULL, LastName varchar(99) NOT NULL, FirstName varchar(99) NOT NULL, Age int CHECK (Age>=15)); Which constraint is applied to the 'Age' column?`,options:[`DEFAULT`,`UNIQUE`,`CHECK`,`NOT NULL`],correctAnswer:2,explanation:`The CHECK constraint is applied to the 'Age' column with the condition (Age>=15), meaning only values greater than or equal to 15 are permitted. The NOT NULL constraint is applied to StudentID, LastName, and FirstName, but not to Age in this statement.`},{id:15,question:`Which of the following data type categories includes 'binary', 'image', and 'varbinary'?`,options:[`Other data types`,`Binary strings`,`Approximate numeric`,`Unicode character strings`],correctAnswer:1,explanation:`'binary', 'image', and 'varbinary' all belong to the Binary strings data type category. Unicode character strings contain types like nchar, ntext, and nvarchar, while Other data types include cursor, sql_variant, table, uniqueidentifier, and xml.`},{id:16,question:`Which of the following is NOT a valid SQL Data Definition Language (DDL) command?`,options:[`CREATE DATABASE`,`DROP TABLE`,`ALTER TABLE`,`INSERT INTO`],correctAnswer:3,explanation:`INSERT INTO is a Data Manipulation Language (DML) command — it adds new rows or records to a table. DDL commands, which define or modify database structures, include CREATE DATABASE, DROP TABLE, ALTER TABLE, TRUNCATE TABLE, and DROP DATABASE.`},{id:17,question:`What does the 'Other data types' category in SQL include?`,options:[`float, real`,`bigint, bit, decimal, int, money, numeric`,`cursor, sql_variant, table, uniqueidentifier, xml`,`date, datetime, time`],correctAnswer:2,explanation:`The 'Other data types' category encompasses specialized types such as cursor, sql_variant, table, uniqueidentifier, and xml. float and real are Approximate numeric; bigint, bit, decimal, int, money, and numeric are Exact numeric; and date, datetime, time are Date and time types.`}]},{sectionId:2,sectionName:`Section 2: Practical Application & Logic`,questions:[{id:18,question:`A university registrar needs to add a brand-new database for the upcoming school year. Which SQL command should be used?`,options:[`CREATE TABLE AcademicYear2025;`,`INSERT INTO DATABASE AcademicYear2025;`,`CREATE DATABASE AcademicYear2025;`,`ALTER DATABASE AcademicYear2025;`],correctAnswer:2,explanation:`CREATE DATABASE is the correct DDL command for creating a new database. Its syntax is CREATE DATABASE database_name. CREATE TABLE creates a table within a database, not the database itself, and ALTER DATABASE is not a standard covered command for this purpose.`},{id:19,question:`A system administrator wants to permanently remove an entire database called 'ArchiveDB' from the server, including all of its contents. Which statement is correct?`,options:[`TRUNCATE DATABASE ArchiveDB;`,`DELETE DATABASE ArchiveDB;`,`DROP DATABASE ArchiveDB;`,`REMOVE DATABASE ArchiveDB;`],correctAnswer:2,explanation:`DROP DATABASE is the correct command to permanently delete an existing database. Its syntax is DROP DATABASE database_name. TRUNCATE applies to tables (not databases), and DELETE and REMOVE are not valid DDL database-level commands.`},{id:20,question:`An instructor wants to retrieve only the unique section codes that students belong to from a Students table, avoiding repeated values in the result. Which query achieves this?`,options:[`SELECT Section FROM Students WHERE Section IS NOT NULL;`,`SELECT UNIQUE Section FROM Students;`,`SELECT DISTINCT Section FROM Students;`,`SELECT Section FROM Students ORDER BY Section;`],correctAnswer:2,explanation:`SELECT DISTINCT is used to retrieve unique (non-duplicate) values from a column. The correct syntax is SELECT DISTINCT columns FROM table_name. 'SELECT UNIQUE' is not valid SQL syntax, and SELECT with WHERE or ORDER BY alone does not eliminate duplicates.`},{id:21,question:`Given the table 'Students', a query needs to return all columns for students whose Age is between 13 and 15, inclusive. Which query is correct?`,options:[`SELECT * FROM Students WHERE Age >= 13 AND Age =< 15;`,`SELECT * FROM Students WHERE Age BETWEEN 13 AND 15;`,`SELECT * FROM Students WHERE Age IN (13, 15);`,`SELECT * FROM Students WHERE Age LIKE 13 AND 15;`],correctAnswer:1,explanation:`The BETWEEN operator checks whether a value falls within a range, inclusive of both boundary values. The correct syntax is: SELECT columns FROM table_name WHERE column BETWEEN value1 AND value2. The IN operator checks for membership in a discrete list, not a range. '=<' is not a valid comparison operator (the correct form is '<=').`},{id:22,question:`A registrar wants to find all students enrolled in sections 'IT101', 'IT102', or 'IT103'. Which query correctly retrieves these records?`,options:[`SELECT * FROM Students WHERE Section BETWEEN 'IT101' AND 'IT103';`,`SELECT * FROM Students WHERE Section = 'IT101' OR 'IT102' OR 'IT103';`,`SELECT * FROM Students WHERE Section IN ('IT101', 'IT102', 'IT103');`,`SELECT * FROM Students WHERE Section LIKE 'IT101' AND 'IT102' AND 'IT103';`],correctAnswer:2,explanation:`The IN operator checks whether a column value matches any value within a specified list. The correct syntax is: SELECT columns FROM table_name WHERE column IN (values). BETWEEN works with ranges, LIKE works with string patterns, and 'OR' used without repeating the column name is not valid SQL syntax.`},{id:23,question:`A developer runs the query: SELECT * FROM Students WHERE LastName LIKE '_b%'; What will this query return?`,options:[`All students whose last names start with the letter 'b'.`,`All students whose last names end with the letter 'b'.`,`All students whose last names have the letter 'b' in the second position.`,`All students whose last names contain exactly two characters.`],correctAnswer:2,explanation:`In LIKE patterns, the underscore (_) represents exactly one character, and the percent sign (%) represents zero or more characters. The pattern '_b%' means: one character in the first position, 'b' in the second position, followed by any number of characters. This retrieves students with 'b' as the second letter of their last name.`},{id:24,question:`What is the functional difference between the '%' wildcard and the '_' wildcard in a SQL LIKE clause?`,options:[`Both wildcards represent exactly one character; they are interchangeable.`,`'%' represents zero, one, or multiple characters, while '_' represents exactly one character.`,`'_' represents zero, one, or multiple characters, while '%' represents exactly one character.`,`'%' is used only with numeric columns, while '_' is used with character columns.`],correctAnswer:1,explanation:`In SQL, the '%' wildcard matches zero, one, or multiple characters in a string pattern, while the '_' wildcard matches exactly one single character. These wildcards are used exclusively with the LIKE operator inside a WHERE clause to perform pattern-based string matching.`},{id:25,question:`A database administrator needs to find all students who have not yet been assigned a section (i.e., the Section field is empty). Which query is correct?`,options:[`SELECT LastName, Section FROM Students WHERE Section = '';`,`SELECT LastName, Section FROM Students WHERE Section = NULL;`,`SELECT LastName, Section FROM Students WHERE Section IS NULL;`,`SELECT LastName, Section FROM Students WHERE Section NOT ASSIGNED;`],correctAnswer:2,explanation:`IS NULL is the correct operator to check whether a field is empty (contains no value). In SQL, NULL cannot be tested with an equality operator (= NULL is always false); instead, IS NULL must be used. The syntax is: SELECT columns FROM table_name WHERE column IS NULL.`},{id:26,question:`A faculty member wants to display all student records sorted by their last name in alphabetical order (A to Z). Which query achieves this?`,options:[`SELECT * FROM Students SORT BY LastName;`,`SELECT * FROM Students ORDER BY LastName DESC;`,`SELECT * FROM Students ORDER BY LastName;`,`SELECT * FROM Students WHERE LastName ORDER BY ASC;`],correctAnswer:2,explanation:`ORDER BY sorts retrieved records in ascending order by default (A to Z, smallest to largest). The correct query is: SELECT * FROM Students ORDER BY LastName. To sort in descending order, DESC must be appended. SORT BY is not valid SQL syntax.`},{id:27,question:`After running a query, a developer notices records are returned in descending order by LastName. Which clause was most likely appended to the ORDER BY statement?`,options:[`ASCENDING`,`ASC`,`DESC`,`REVERSE`],correctAnswer:2,explanation:`DESC is the keyword appended to an ORDER BY clause to sort results in descending order (Z to A, largest to smallest). The full syntax would be: SELECT * FROM table_name ORDER BY columns DESC. ASC (ascending) is the default behavior and is often omitted. ASCENDING and REVERSE are not valid SQL keywords.`},{id:28,question:`A student record for 'Reyes' in section 'IT102' needs to be added to the Students table, but only those two columns need values. Which INSERT statement is correct?`,options:[`INSERT INTO Students VALUES ('Reyes', 'IT102');`,`INSERT INTO Students (LastName, Section) VALUES ('Reyes', 'IT102');`,`INSERT Students SET LastName = 'Reyes', Section = 'IT102';`,`ADD INTO Students (LastName, Section) VALUES ('Reyes', 'IT102');`],correctAnswer:1,explanation:`When inserting values into specific columns (not all columns), the correct syntax is: INSERT INTO table_name (columns) VALUES (values). The unqualified INSERT INTO table_name VALUES (values) form is used only when providing values for ALL columns in table order. 'INSERT Students SET' and 'ADD INTO' are not valid SQL syntax.`},{id:29,question:`A developer needs to update a student's record: set their Section to 'IT202' and Status to 'Irregular' for the student with StudentID '2018-100013'. Which statement is correct?`,options:[`UPDATE Students SET Section = 'IT202' AND Status = 'Irregular' WHERE StudentID = '2018-100013';`,`UPDATE Students SET Section = 'IT202', Status = 'Irregular' WHERE StudentID = '2018-100013';`,`MODIFY Students SET Section = 'IT202', Status = 'Irregular' WHERE StudentID = '2018-100013';`,`UPDATE Students (Section, Status) VALUES ('IT202', 'Irregular') WHERE StudentID = '2018-100013';`],correctAnswer:1,explanation:`The correct syntax for UPDATE is: UPDATE table_name SET column1 = value1, column2 = value2, ... WHERE condition. Multiple column assignments are separated by commas, not AND. The keyword MODIFY is not a valid DML command, and the VALUES syntax belongs to INSERT, not UPDATE.`},{id:30,question:`A registrar wants to remove the record of the student with StudentID '2018-100013' from the Students table. Which statement correctly accomplishes this?`,options:[`REMOVE FROM Students WHERE StudentID = '2018-100013';`,`DROP FROM Students WHERE StudentID = '2018-100013';`,`DELETE FROM Students WHERE StudentID = '2018-100013';`,`TRUNCATE FROM Students WHERE StudentID = '2018-100013';`],correctAnswer:2,explanation:`DELETE FROM is the correct DML command to remove specific records. Its syntax is: DELETE FROM table_name WHERE condition. Without a WHERE clause, it deletes all records. TRUNCATE removes all rows but cannot be filtered with a WHERE clause. DROP removes entire tables or databases, and REMOVE is not a valid SQL command.`},{id:31,question:`Which DML command is analogous to the act of 'erasing a row from a ledger while keeping the ledger itself intact'?`,options:[`DROP TABLE`,`TRUNCATE TABLE`,`DELETE`,`ALTER TABLE DROP COLUMN`],correctAnswer:2,explanation:`DELETE removes specific records (rows) from a table while leaving the table structure fully intact, analogous to erasing individual entries from a ledger. DROP TABLE removes the entire table (structure and data). TRUNCATE removes all rows but cannot target specific ones. ALTER TABLE DROP COLUMN removes a column, not a row.`},{id:32,question:`A developer attempts to query: SELECT * FROM Students WHERE Age >= 18; What must NOT be done to the numeric value 18 in this query?`,options:[`Place it after the comparison operator.`,`Enclose it in single quotation marks.`,`Use it with the >= comparison operator.`,`Reference it in the WHERE clause.`],correctAnswer:1,explanation:`Numeric field values in SQL WHERE clauses must NOT be enclosed in quotation marks. Enclosing a number in single quotes (e.g., '18') treats it as a string literal, which can cause type mismatch errors or incorrect comparisons. Character and string values, by contrast, must be wrapped in single quotes.`},{id:33,question:`An existing Orders table has a CustomerID column that should reference the CustomerID column in the Customers table. Which statement correctly adds this FOREIGN KEY relationship?`,options:[`ALTER TABLE Orders ADD PRIMARY KEY (CustomerID) REFERENCES Customers (CustomerID);`,`ALTER TABLE Orders ADD FOREIGN KEY (CustomerID) REFERENCES Customers (CustomerID);`,`CREATE TABLE Orders ADD FOREIGN KEY (CustomerID) REFERENCES Customers (CustomerID);`,`ALTER TABLE Customers ADD FOREIGN KEY (CustomerID) REFERENCES Orders (CustomerID);`],correctAnswer:1,explanation:`To add a FOREIGN KEY to an existing table, the correct syntax is: ALTER TABLE table1_name ADD FOREIGN KEY (table1_column) REFERENCES table2_name (table2_column). The foreign key is defined on the child table (Orders), referencing the parent table (Customers) — not the other way around. CREATE TABLE is used for new tables, not for altering existing ones.`},{id:34,question:`A developer needs to change the data type of the 'MiddleName' column in the Students table from varchar(99) to nvarchar(99). Which statement is correct?`,options:[`ALTER TABLE Students MODIFY COLUMN MiddleName nvarchar(99);`,`ALTER TABLE Students CHANGE MiddleName nvarchar(99);`,`ALTER TABLE Students ALTER COLUMN MiddleName nvarchar(99);`,`UPDATE TABLE Students SET MiddleName = nvarchar(99);`],correctAnswer:2,explanation:`To modify an existing column's data type in SQL, the correct syntax is: ALTER TABLE table_name ALTER COLUMN column datatype. This matches the established DDL syntax for modifying a column. MODIFY COLUMN and CHANGE are not part of the SQL syntax covered, and UPDATE TABLE SET is a DML command, not a structural modification command.`}]}]},ee={examTitle:`Prefinals Exam Reviewer - TEM`,examDescription:`Ideation, Design Thinking, Entrepreneurship and the Philippine Labor Law`,totalQuestions:35,sections:[{sectionId:1,sectionName:`Section 1`,questions:[{id:0,question:`Ideation is best described as an innovative tool used to:`,options:[`Reduce operational costs in existing businesses`,`Add value to ideas, products, and available services`,`Monitor competitor performance in the market`,`Standardize production processes across industries`],correctAnswer:1,explanation:`Ideation is defined as an innovative tool for adding value to ideas, products, and available services. It helps companies experiment with new business ideas, models, and solutions, especially in rapidly changing market conditions.`},{id:1,question:`Which element of idea generation involves evaluating one's marketable skill sets to identify a potential business venture?`,options:[`Current events`,`Invention`,`Personal skill set`,`Product improvement`],correctAnswer:2,explanation:`The 'Personal skill set' element involves evaluating marketable skill sets and identifying which skill is a potential business venture. For example, someone good at cooking may develop a new recipe as a business idea.`},{id:2,question:`A TV manufacturer discovered that customers frequently misplace their remote controls and responded by building a 'remote-control finder' button into the TV itself. This is an example of which element of idea generation?`,options:[`Product improvement`,`Personal skill set`,`Current events`,`Invention`],correctAnswer:3,explanation:`This scenario illustrates 'Invention' — analyzing an existing market need (even one that is not immediately obvious) and developing a product or service to meet it. The company identified a silent need and created a solution.`},{id:3,question:`Combining Ariel powder detergent and Downy fabric conditioner into a single product is an example of which element of idea generation?`,options:[`Invention`,`Current events`,`Personal skill set`,`Product improvement`],correctAnswer:3,explanation:`'Product improvement' involves experimenting with an existing product by adding services, additional processes, or combining it with other products to increase value. The Ariel-Downy combination is a textbook example.`},{id:4,question:`In brainstorming, the precept of 'quality through quantity' means that:`,options:[`Only high-quality ideas should be submitted to the team`,`The quantity of ideas generated is prioritized over participation`,`Quality and vigor of ideas are achieved by generating a large volume of ideas`,`Ideas must be filtered for quality before they are shared with the group`],correctAnswer:2,explanation:`The 'quality through quantity' precept states that the quality and vigor of ideas are attained through quantity. The more ideas a team develops, the greater the chance of producing an innovative and functional solution.`},{id:5,question:`Which brainstorming precept states that criticism must NOT hinder the creative process and that evaluation should be postponed to a later stage?`,options:[`Quality through quantity`,`Refrain from judging ideas`,`Bold ideas are welcomed`,`Combining and embellishing ideas`],correctAnswer:1,explanation:`'Refrain from judging ideas' holds that criticism should not hinder the creative process and the generation of bold ideas. The focus must be on producing and embellishing ideas, with evaluation postponed to later.`},{id:6,question:`The co-creation workshop ideation method is BEST used when:`,options:[`A single expert needs to present a finalized solution`,`An extended team must handle large amounts of data or add knowledge from different specialists`,`A moderator needs to generate ideas independently before the meeting`,`The team wants to rank ideas using a scoring matrix`],correctAnswer:1,explanation:`The co-creation workshop is best used when an extended team can deal with a large amount of data or when it is necessary to add knowledge from different specialists involved in a project. It is also beneficial during moments of gridlock.`},{id:7,question:`Which ideation method is best used in collaborative meetings and project presentations to make generated ideas tangible and allow better visualization for decision-making?`,options:[`Brainstorming`,`Co-creation workshop`,`Menu of ideas`,`Decision matrix`],correctAnswer:2,explanation:`The 'Menu of Ideas' is best used in collaborative meetings, project presentations, and co-creation workshops to make the volume of ideas generated tangible. It allows better visualization for the decision-making process and serves to document partial results.`},{id:8,question:`In the Decision Matrix method, ideas are listed and evaluated based on:`,options:[`The popularity of each idea among team members`,`Guiding criteria created throughout the project, forming a collaborative evaluation matrix`,`The personal preferences of the project moderator`,`The financial cost of each idea relative to the project budget`],correctAnswer:1,explanation:`In the Decision Matrix, ideas generated in the project are listed and grouped by similarity, then the guiding criteria created throughout the project are combined to form a collaborative matrix evaluating how each idea meets each requirement.`},{id:9,question:`Design thinking is described as iterative. Which of the following BEST explains what this means?`,options:[`The process follows a strict linear path from empathy to testing with no return`,`A person tests an assumption, returns to the prototype stage, and modifies it based on results and feedback`,`The process is repeated only when the final product fails in the market`,`Multiple teams work simultaneously on identical prototypes`],correctAnswer:1,explanation:`Design thinking is iterative because a person tests an assumption, returns to the prototype stage, and modifies it based on the results and feedback. It is not a one-time linear process.`},{id:10,question:`Design thinking is referred to as 'the glue between disciplines' because it:`,options:[`Requires all team members to have the same academic background`,`Works horizontally across an organization to improve communications and deliver new insights`,`Focuses exclusively on technological innovation in product development`,`Restricts creative exploration to structured business frameworks`],correctAnswer:1,explanation:`Design thinking works horizontally across an organization to improve communications and deliver new insights. Its integrative nature — balancing business and art, intuition and logic — earns it the title 'the glue between disciplines.'`},{id:11,question:`Which phase of the design thinking process focuses on understanding the physical and emotional needs of people and seeing things 'with a fresh set of eyes'?`,options:[`Phase II: Defining the Problem`,`Phase III: Brainstorming Solutions`,`Phase I: Understanding and Empathy`,`Phase V: Testing the Solution`],correctAnswer:2,explanation:`Phase I: Understanding and Empathy focuses on the human-centered design process. It requires understanding how people do things, their physical and emotional needs, and what is meaningful to them — essentially gaining 'a fresh set of eyes.'`},{id:12,question:`In design thinking, a Point-of-View (POV) statement is formed by combining which three elements?`,options:[`Problem, solution, and budget`,`User, need, and insight`,`Market, product, and feedback`,`Empathy, prototype, and testing`],correctAnswer:1,explanation:`A Point-of-View (POV) is established by combining three elements: the user (target market), the need (a salient, important need to fulfill), and the insight (developed through synthesizing information with empathy and research).`},{id:13,question:`Which of the following is NOT a benefit of the prototyping phase in design thinking?`,options:[`To ideate and problem-solve by identifying possible design issues`,`To fail quickly and cheaply by committing few resources upfront`,`To finalize the product design and begin mass production`,`To test possibilities without committing to a direction too early`],correctAnswer:2,explanation:`Finalizing product design and beginning mass production is NOT a purpose of the prototype phase. Prototyping is explicitly about low-resolution, quick, and cheap builds meant to elicit feedback, test variables, and allow for iteration — not to commit to a final direction.`},{id:14,question:`In the testing phase of design thinking, the rule of thumb 'prototype as if you are right, but test as if you are wrong' means:`,options:[`Assume the prototype is flawed before users even interact with it`,`Build with full confidence, but approach testing with openness to refine and improve solutions`,`Only test prototypes that have already been validated by experts`,`Avoid testing once the prototype has been approved by the team`],correctAnswer:1,explanation:`This rule means a designer builds with conviction and confidence but enters testing with humility and openness. Testing is the stage to refine and improve solutions based on actual user feedback, not to confirm existing assumptions.`},{id:15,question:`Which of the following is NOT listed as an advantage of design thinking?`,options:[`It assists business people in keeping their focus on humans and their needs`,`It promotes a learn-by-doing approach and suggests failure is an excellent way to learn`,`It guarantees a commercially successful product upon completion`,`It relies on both creativity and logic`],correctAnswer:2,explanation:`Design thinking does NOT guarantee commercial success. Its advantages are its human-centered focus, reliance on both creativity and logic, collaborative nature, and promotion of a learn-by-doing approach. Market outcomes depend on many external factors beyond the DT process.`},{id:16,question:`Under the Philippine Labor Code, which government body is responsible for developing and monitoring a comprehensive employment program?`,options:[`The Department of Finance`,`The Labor Secretary`,`The Bureau of Employment Services`,`The Regional Tripartite Wages and Productivity Boards`],correctAnswer:2,explanation:`The Bureau of Employment Services is responsible for developing and monitoring a comprehensive employment program. The Labor Secretary, on the other hand, develops and organizes programs that facilitate labor mobility.`},{id:17,question:`A 'private recruitment entity,' as defined under the Philippine Labor Code, refers to:`,options:[`Any entity that recruits workers and charges a fee from employers`,`A person or association engaged in recruitment and placement without charging any fee from workers or employers`,`A government agency that issues licenses to employment agencies`,`Any corporation that recruits workers exclusively for overseas employment`],correctAnswer:1,explanation:`A private recruitment entity is any person or association engaged in the recruitment and placement of workers, locally or overseas, WITHOUT charging — directly or indirectly — any fee from workers or employers. This distinguishes it from a fee-charging employment agency.`},{id:18,question:`Under the Philippine Labor Code, which type of employment covers workers who perform full-time labor for a business indefinitely?`,options:[`Probationary employment`,`Casual employment`,`Fixed-term employment`,`Regular employment`],correctAnswer:3,explanation:`Regular employment covers workers who perform full-time labor for a business indefinitely. This is the most protected form of employment under Philippine labor law, and employers cannot terminate regular employees without just cause.`},{id:19,question:`A casual employee who has worked for a company for one (1) continuous year may:`,options:[`Be automatically promoted to a supervisory position`,`Transition into a regular employee`,`Receive a fixed-term contract renewal`,`Be classified as a project employee`],correctAnswer:1,explanation:`Under the Philippine Labor Code, casual workers engage in tasks not central to the business. Once a casual employee works for one year, they can transition into a regular employee, affording them greater job security.`},{id:20,question:`Under the Philippine Labor Code, wages shall be paid at least:`,options:[`Once a week, with no exceptions`,`Once every two weeks or twice a month at intervals not exceeding 16 days`,`Once a month, on the last business day`,`Once every two weeks, with no exceptions for force majeure`],correctAnswer:1,explanation:`Wages shall be paid at least once every two weeks or twice a month at intervals not exceeding 16 days. In cases of force majeure, payment must be made immediately after such circumstances have ceased. No employer shall pay less frequently than once a month.`},{id:21,question:`Which standard payroll deduction is specifically described as a social security protection program for workers in PRIVATE institutions?`,options:[`GSIS`,`PhilHealth`,`Pag-IBIG`,`SSS`],correctAnswer:3,explanation:`The Social Security System (SSS) is a social security protection program specifically for workers in private institutions. GSIS, by contrast, covers government employees.`},{id:22,question:`Which of the following is NOT a standard payroll deduction mandated under the Philippine Labor Code?`,options:[`Social Security System (SSS)`,`PhilHealth`,`Pag-IBIG (HDMF)`,`Bureau of Internal Revenue (BIR) withholding tax`],correctAnswer:3,explanation:`The four standard payroll deductions explicitly identified are SSS, GSIS, PhilHealth, and Pag-IBIG (HDMF). While BIR withholding tax is a legal deduction in practice, it is NOT listed among the four standard payroll deductions defined in this context.`},{id:23,question:`Under the conditions of employment, the night shift differential entitles every employee to a pay premium of not less than:`,options:[`15% of their regular wage for each hour worked between 10 PM and 5 AM`,`10% of their regular wage for each hour worked between 10 PM and 6 AM`,`25% of their regular wage for each hour worked between 12 AM and 6 AM`,`30% of their regular wage for each hour worked between 8 PM and 6 AM`],correctAnswer:1,explanation:`Every employee shall be paid a night shift differential of not less than 10% of their regular wage for each hour of work between 10 o'clock in the evening and 6 o'clock in the morning.`},{id:24,question:`For overtime work performed beyond eight (8) hours on a regular workday, the additional compensation must be at least:`,options:[`Regular wage plus at least 10 percent`,`Regular wage plus at least 30 percent`,`Regular wage plus at least 25 percent`,`Regular wage plus at least 15 percent`],correctAnswer:2,explanation:`Work performed beyond eight hours a day on a regular workday entitles the employee to an additional compensation equivalent to their regular wage plus at least 25 percent. The 30 percent premium applies to overtime on holidays or rest days.`},{id:25,question:`Under the Philippine Labor Code, service incentive leave entitles every qualifying employee to how many paid leave days per year?`,options:[`10 days`,`7 days`,`3 days`,`5 days`],correctAnswer:3,explanation:`Every employee who has rendered at least one year of service is entitled to a yearly service incentive leave of five (5) days with pay.`},{id:26,question:`Under the Medical and Dental Services provision, a company with exactly 250 employees is required to provide which of the following?`,options:[`Services of a full-time registered nurse only`,`Services of a full-time physician, dentist, and full-time registered nurse, plus a dental clinic and infirmary`,`Services of a graduate first-aider only`,`Services of a full-time registered nurse, a part-time physician and dentist, and an emergency clinic`],correctAnswer:3,explanation:`For companies where the number of employees exceeds 200 but does not exceed 300, the requirement is a full-time registered nurse, a part-time physician and dentist, and an emergency clinic.`}]},{sectionId:2,sectionName:`Section 2`,questions:[{id:27,question:`Maria runs a small home bakery. After observing that many of her customers ask for sugar-free versions of her pastries, she spends a month researching low-sugar baking techniques and develops a new product line targeting diabetic customers. Which element of idea generation BEST describes Maria's approach?`,options:[`Product improvement, because she is adding a variation to existing products`,`Personal skill set, because she is leveraging her baking expertise to identify a venture`,`Invention, because she analyzed an existing market need and developed a product to meet it`,`Current events, because she is responding to health trends in the market`],correctAnswer:2,explanation:`Maria's approach reflects 'Invention' — she analyzed an existing market need (sugar-free options for diabetic customers) and positioned a product to meet that identified need. While her skill and awareness of trends play a role, the defining element is her response to a recognized market gap.`},{id:28,question:`During a product development meeting, a team member proposes what others think is an outlandish idea: delivering their software product with a personalized onboarding video for each customer. The team leader immediately dismisses it as impractical. Which brainstorming precept is the team leader VIOLATING?`,options:[`Quality through quantity`,`Refrain from judging ideas`,`Bold ideas are welcomed`,`Combining and embellishing ideas`],correctAnswer:1,explanation:`The team leader is violating 'Refrain from judging ideas.' Brainstorming requires that criticism not hinder the creative process. Evaluation must be postponed to a later stage; dismissing ideas prematurely undermines the purpose of the session.`},{id:29,question:`A startup is developing a new mobile health app. They need input from medical professionals, UX designers, and behavioral psychologists. They are facing conflicting perspectives and feel stuck. Which ideation method is MOST appropriate to unblock the team and integrate knowledge from multiple disciplines?`,options:[`Brainstorming, because it generates a large volume of ideas efficiently`,`Decision matrix, because it allows comparison of all competing ideas`,`Co-creation workshop, because it is ideal for multi-specialist collaboration and resolving gridlock`,`Menu of ideas, because it documents partial results for future reference`],correctAnswer:2,explanation:`The co-creation workshop is best used when it is necessary to add knowledge from different specialists involved in a project and is specifically beneficial for moments of gridlock when new insights about ideas are needed — exactly the scenario described.`},{id:30,question:`A design team finishes observing and interviewing their target users — elderly citizens struggling to use smartphone apps. One designer notes: 'They say they want simpler apps, but we watched them spend 20 minutes trying to find the back button they claimed to know.' Which design thinking activity does this insight BEST align with, and why?`,options:[`Prototyping, because the team should immediately build a simplified interface based on user feedback`,`Empathy through observation, because the most powerful realizations come from noticing disconnects between what someone says and what they do`,`Defining the problem, because the team now has enough data to write a final problem statement`,`Testing, because users are interacting with an existing product`],correctAnswer:1,explanation:`This scenario demonstrates empathy through observation. As noted in design thinking, some of the most powerful realizations come from noticing a disconnect between what someone says and what they do. The observation contradicts the users' verbal claims, generating deeper insight.`},{id:31,question:`A design team crafts the following statement: 'A busy working parent needs a way to plan nutritious weekday meals quickly because they feel guilty about relying on fast food but lack time to research healthy options.' This statement BEST represents which design thinking concept?`,options:[`A brainstorming prompt used to generate ideas in Phase III`,`A prototype variable to be tested in Phase IV`,`A Point-of-View (POV) statement combining user, need, and insight`,`A service incentive specification to guide product testing`],correctAnswer:2,explanation:`This is a Point-of-View (POV) statement. It combines the three required elements: user (busy working parent), need (quick nutritious meal planning), and insight (guilt about fast food and lack of time). POV statements define the right challenge to address.`},{id:32,question:`A software company recently changed its customer support system to an automated chatbot, replacing five support agents. Under the Philippine Labor Code, the affected employees would be entitled to a separation pay of:`,options:[`At least one-half month pay for every year of service`,`At least one month pay or one month pay per year of service, whichever is higher`,`No separation pay, as automation is a legitimate business decision`,`At least two months pay for every year of service`],correctAnswer:1,explanation:`Termination due to the installation of labor-saving devices (such as automation/chatbots) entitles the affected worker to separation pay equivalent to at least one month of income or at least one month of revenue for every year of service, whichever is higher.`},{id:33,question:`Ana has been working as a cashier at a small grocery store for 14 months. The store owner tells her she is still considered a casual employee and cannot claim regular employment benefits. Under the Philippine Labor Code, which of the following BEST evaluates this claim?`,options:[`The owner is correct; cashiers in retail are always classified as casual employees regardless of tenure`,`The owner is incorrect; Ana has worked for more than one year, which means she may now transition into a regular employee`,`The owner is correct; casual employment requires at least two years before transition to regular status`,`The owner is incorrect, but only if Ana holds a written employment contract specifying regular status`],correctAnswer:1,explanation:`Under Philippine labor law, once a casual employee works for one year, they can transition into a regular employee. Ana has worked for 14 months — exceeding the one-year threshold — making her eligible for regular employment status regardless of her initial casual classification.`},{id:34,question:`Marco resigns from his job without serving any written notice because his employer has been publicly humiliating him in front of colleagues and using abusive language during meetings. Which principle of the Philippine Labor Code is MOST applicable to Marco's decision?`,options:[`Marco violated the Labor Code by failing to render 30 days of notice, making him liable for damages`,`Marco's resignation is valid without notice because his employer's conduct constitutes grave insult and inhuman treatment — recognized grounds for immediate termination by the employee`,`Marco must file a complaint with the DOLE before he can legally leave without notice`,`Marco's resignation is only valid if approved by the Bureau of Employment Services`],correctAnswer:1,explanation:`Under the Labor Code, an employee may terminate the employment relationship without serving any notice when the employer commits grave insult on the honor and person of the employee, or subjects the employee to inhuman and unbearable treatment. Both conditions appear to be present in Marco's case.`}]}]},x={examTitle:`Prefinals Exam Reviewer - HCI`,examDescription:`UI Development and Interactive System Development`,totalQuestions:35,sections:[{sectionId:1,sectionName:`Section 1`,questions:[{id:0,question:`What is a framework in the context of software development?`,options:[`A library of precomposed UI objects and predefined routines`,`A well-defined environment that exposes toolkits, functions, or algorithms for developing new applications`,`A manipulable graphical object used for user interaction`,`A set of native user interface components for handling events`],correctAnswer:1,explanation:`A framework is defined as a well-defined environment that exposes toolkits, functions, or algorithms that can be used to develop new applications. It contains specific structure for creating, building, and sometimes deploying applications. A toolkit, by contrast, is the library of precomposed UI objects.`},{id:1,question:`Which of the following BEST describes a UI toolkit?`,options:[`A well-defined development environment that contains structure for building and deploying applications`,`A library of precomposed UI objects and a predefined set of events or routines composed from the lower-level UI software layer`,`A framework that manages the lifecycle of applications and provides access to non-code resources`,`An event queue mechanism that processes interactions on a first-in, first-out basis`],correctAnswer:1,explanation:`A UI toolkit is specifically defined as a library of precomposed UI objects and a predefined set of events or routines composed from the lower-level UI software layer. It abstracts system details of event handling to make programming easier. Frameworks are the broader environments that may contain toolkits.`},{id:2,question:`What is a widget in a graphical user interface (GUI)?`,options:[`A class library for creating 2D graphical objects in Java`,`An essential GUI element that displays information or provides a way for users to interact with the OS or application`,`A predefined set of events or routines in a UI toolkit`,`A Content Provider that enables applications to access data from other applications`],correctAnswer:1,explanation:`A widget is defined as an essential part of a GUI that displays information or provides a specific way for users to interact with the operating system or application. Examples include icons, menus, buttons, checkboxes, scroll bars, and toggle buttons.`},{id:3,question:`Which of the following is NOT an example of a widget?`,options:[`Progress indicator`,`Scroll bar`,`Toggle button`,`Resource Manager`],correctAnswer:3,explanation:`Widgets include icons, menus, buttons, selection and text boxes, progress indicators, on-off checkmarks, scroll bars, windows, toggle buttons, forms, and images. A Resource Manager is a component of the Android UI Execution Framework that provides access to non-code resources — it is not a widget.`},{id:4,question:`The Android UI Execution Framework is based on which programming language for its user programming environment?`,options:[`Python`,`C++`,`Java`,`Swift`],correctAnswer:2,explanation:`The user programming environment and execution mode for Android is based on Java. The framework and features of the Android operating system are available through APIs written in Java, and its event-processing model and toolkit structure are mostly the same as Java AWT.`},{id:5,question:`Which component of the Android framework enables all applications to display custom alerts in the status bar?`,options:[`Activity Manager`,`Resource Manager`,`Content Provider`,`Notification Manager`],correctAnswer:3,explanation:`The Notification Manager is the Android framework component that enables all applications to display custom alerts in the status bar. The Activity Manager manages application lifecycles, the Resource Manager provides access to non-code resources, and the Content Provider enables data sharing between applications.`},{id:6,question:`In the Android framework, which component manages the lifecycle of applications?`,options:[`Notification Manager`,`Activity Manager`,`Content Provider`,`View System`],correctAnswer:1,explanation:`The Activity Manager is the Android framework component responsible for managing the lifecycle of applications. It is one of five key components provided by the Android framework alongside the View System, Resource Manager, Notification Manager, and Content Provider.`},{id:7,question:`How does the Android framework process events from the event queue?`,options:[`Last-in, first-out (LIFO)`,`Priority-based ordering`,`First-in, first-out (FIFO)`,`Random order based on event type`],correctAnswer:2,explanation:`The Android framework maintains an event queue into which events are placed as they occur, then removes them on a first-in, first-out (FIFO) basis. This ensures events are processed in the order they are received.`},{id:8,question:`Which of the following is NOT one of the three major types of discrete events in iOS as described by Kim (2015)?`,options:[`Multi-touch`,`Motion`,`Remote control`,`Network events`],correctAnswer:3,explanation:`The three major types of discrete events for iOS are multi-touch, motion, and remote control (such as remote-controlled headphones). Network events is not listed as one of the three major discrete iOS event types in this classification.`},{id:9,question:`What framework is used in iOS to handle continuous streams of sensor data such as those from accelerometers and gyroscopes?`,options:[`UIKit Framework`,`Java AWT`,`Core Motion Framework`,`Android UI Execution Framework`],correctAnswer:2,explanation:`A separate Core Motion framework is used for continuous streams of sensor data such as those from accelerometers and gyroscopes. The UIKit framework handles discrete touch events and the main run loop, not continuous sensor streams.`},{id:10,question:`In iOS, how are low-level touch events sent to the application?`,options:[`As AWTEvent objects defined by the Java AWT framework`,`As UIEvent objects as defined by the UIKit framework`,`As raw sensor data passed directly to the Core Motion framework`,`As discrete packets processed by the Activity Manager`],correctAnswer:1,explanation:`When users touch views of an iOS application, iOS generates low-level touch events which are delivered as UIEvent objects (via UIKit) to the view on which the touch occurred. The view then analyzes and responds to the touch event.`},{id:11,question:`Which of the following is a feature offered by the iOS UIKit framework?`,options:[`An event queue processed on a FIFO basis`,`An Activity Manager for lifecycle control`,`Animation support and accessibility support`,`A Content Provider for inter-application data sharing`],correctAnswer:2,explanation:`The iOS UIKit framework offers numerous features including animation support, document support, drawing and printing support, text management, search support, and accessibility support, among others. The FIFO event queue and Activity Manager are Android-specific features.`},{id:12,question:`Java AWT handles a large subset of interaction events called AWTEvents. Which of the following accurately describes AWTEvents?`,options:[`They are descendants of EventObjects that cover UI events such as mouse click and keyboard input`,`They are the same as UIEvent objects used in the iOS UIKit framework`,`They are raw sensor events managed by a Core Motion equivalent in Java`,`They are events placed in a FIFO queue unique to the Android framework`],correctAnswer:0,explanation:`AWTEvents are descendants of EventObjects that cover most of the useful UI events, such as mouse click and keyboard input. Java AWT is a part of the UI execution framework for Java that handles this large subset of interaction events.`},{id:13,question:`Which of the following is a feature supported by Java AWT according to Oracle?`,options:[`A Notification Manager for displaying custom status bar alerts`,`Layout managers for flexible window layouts independent of window size or screen resolution`,`A View System for building rich application user interfaces`,`An Activity Manager that manages the lifecycle of applications`],correctAnswer:1,explanation:`Java AWT supports GUI programming with features including layout managers for flexible window layouts that do not depend on a particular window size or screen resolution. The Notification Manager, View System, and Activity Manager are components specific to the Android framework.`},{id:14,question:`Which Web UI framework uses the Model-View-Controller (MVC) approach and is designed for fast development of Java applications, though it is NOT flexible due to rigid coding and designing rules?`,options:[`JavaServer Faces (JSF)`,`Wicket`,`Struts`,`Java AWT`],correctAnswer:2,explanation:`Struts is the open-source Web UI framework built on the MVC approach, designed for fast development and testing of Java applications. However, it is noted as not being flexible due to a set of coding and designing rules integrated into the framework.`},{id:15,question:`Which Web UI framework is described as lightweight, built on a component-based language, supported by Apache Software Foundation, and allows easy HTML integration?`,options:[`JavaServer Faces (JSF)`,`Struts`,`Wicket`,`Splash UI Kit`],correctAnswer:2,explanation:`Wicket, supported by Apache Software Foundation, is described as a lightweight Web framework built for designing simple but elegant applications in a component-based language. It allows easy HTML integration and is noted for being useful and responsive.`},{id:16,question:`The Travel UI Kit is a free mobile toolkit that contains how many different screen designs, and in what format?`,options:[`6 screen designs in PSD format`,`55 screen designs in Sketch format`,`50 screen designs in Sketch format`,`50 screen designs in PSD format`],correctAnswer:2,explanation:`The Travel UI Kit, designed by Ena Bacanovic, contains 50 different screen designs in Sketch format. The Spool UI Kit contains 6 screen designs in PSD format, and the Splash UI Kit contains more than 55 screens.`},{id:17,question:`Which mobile UI kit is powered by Envato Elements Pty Ltd. and is described as one of the best toolkits for creating iOS mobile applications?`,options:[`Spool UI Kit`,`Travel UI Kit`,`Splash UI Kit`,`Wicket Mobile Kit`],correctAnswer:2,explanation:`The Splash UI Kit, powered by Envato Elements Pty Ltd., is described as one of the best toolkits for creating iOS mobile applications, containing more than 55 high-quality, ready-to-use screens.`},{id:18,question:`The MVC framework was initially proposed by the designers of which programming language?`,options:[`Java`,`C++`,`Python`,`Smalltalk`],correctAnswer:3,explanation:`The designers of Smalltalk initially proposed the MVC approach as a computational architecture for interactive programs. Smalltalk is noted as one of the first object-oriented and modular languages in programming history.`},{id:19,question:`In the MVC framework, which component is responsible for specifying the logical structure of data and the associated high-level classes in a software application?`,options:[`View`,`Controller`,`Model`,`Toolkit`],correctAnswer:2,explanation:`The Model component specifies the logical structure of data and the associated high-level classes in a software application. It is a domain-specific representation of data describing the processes in an application. When a model changes state, it notifies associated views to refresh.`},{id:20,question:`In the MVC framework, which component handles all the business logic, processes incoming requests, manipulates data using the model, and interacts with views to render the final output?`,options:[`Model`,`View`,`Controller`,`Widget`],correctAnswer:2,explanation:`The Controller serves as the interface between the model and view components. It processes all business logic and incoming requests, manipulates data using the model component, and interacts with views to render the final output of a software application.`},{id:21,question:`Which of the following is NOT an advantage of the MVC framework?`,options:[`Supports test-driven development`,`Allows multiple views for a single model`,`Enables parallel development of all MVC components`,`Ensures efficient data access in the view layer through code reuse`],correctAnswer:3,explanation:`Inefficiency of data access in view because of minimal code duplication is listed as a DISADVANTAGE of the MVC framework, not an advantage. The other options — supporting test-driven development, multiple views for a model, and parallel development — are all listed advantages.`},{id:22,question:`Which of the following is a disadvantage of the MVC framework?`,options:[`It cannot support multiple views for a single model`,`Developers must be knowledgeable about the business process for each MVC component`,`It does not support the separation of data from the display layer`,`It cannot generate SEO-friendly URLs`],correctAnswer:1,explanation:`A stated disadvantage of the MVC framework is that programmers and developers must be knowledgeable about the business process linked to the application development for each MVC component. The MVC framework does support multiple views, separation of data, and SEO-friendly URL generation — these are advantages.`},{id:23,question:`In the MVC implementation flow, what happens immediately after the browser sends a request to the MVC application?`,options:[`The result of the model is passed to the view`,`The view renders the result for user interaction`,`The incoming request is directed to the controller`,`The controller updates the model directly`],correctAnswer:2,explanation:`According to the MVC implementation steps, Step 1 is that a browser sends a request to the MVC application, and Step 2 is that the incoming request is directed to the controller. The controller then processes the request based on the data model before results flow to the
